# Local dev: PostgreSQL + Redis for RiseFlow.Api (Npgsql) and RiseFlow.Platform.Api (FSH).
# Start: docker compose up -d
# Stop:  docker compose down
# Reset DB volume (wipes data): docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - riseflow-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  riseflow-postgres-data:
